<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Data Viz Portal</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="logo">F1 Data Viz Portal <span style="font-size: 0.75rem; color: var(--text-muted); margin-left: 0.5rem; font-weight: normal;">v1.14.6</span></div>
        <div class="controls">
            <label for="race-selector">Select Race:</label>
            <select id="race-selector"></select>
        </div>
    </header>

    <main class="dashboard">
        <div class="dashboard-header">
            <h1 id="race-title">Loading...</h1>
            <p id="race-stats"></p>
        </div>

        <section class="viz-container" id="beeswarm-container">
            <div class="viz-header-controls">
                <h2>Lap-Time Beeswarm</h2>
                <div class="viz-controls">
                    <label class="toggle-label">
                        <input type="checkbox" id="outlier-toggle">
                        Show Outliers (e.g. Pit stops, VSC)
                    </label>
                    <div id="beeswarm-legend" class="legend-container"></div>
                </div>
            </div>
            <div id="beeswarm-plot" class="chart"></div>
        </section>

        <section class="viz-container" id="corner-speed-container">
            <h2>Average Corner Speeds</h2>
            <div id="corner-speed-chart" class="chart speed-subplots"></div>
        </section>
        
        <section class="viz-container" id="bump-container">
            <h2>Position Bump Chart</h2>
            <div id="bump-chart" class="chart"></div>
        </section>
    </main>

    <div id="tooltip" class="tooltip hidden"></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
