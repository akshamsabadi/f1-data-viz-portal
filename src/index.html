<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Data Viz Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="logo">F1 Data Viz Portal</div>
        <div class="controls">
            <label for="race-selector">Select Race:</label>
            <select id="race-selector"></select>
        </div>
    </header>

    <main class="dashboard">
        <div class="dashboard-header">
            <h1 id="race-title">Loading...</h1>
            <p id="race-stats"></p>
        </div>

        <section class="viz-container" id="beeswarm-container">
            <h2>Lap-Time Beeswarm</h2>
            <div id="beeswarm-plot" class="chart"></div>
        </section>

        <div class="grid-row">
            <section class="viz-container" id="interval-container">
                <h2>Interval Battle</h2>
                <div id="interval-chart" class="chart"></div>
            </section>
            
            <section class="viz-container" id="bump-container">
                <h2>Position Bump Chart</h2>
                <div id="bump-chart" class="chart"></div>
            </section>
        </div>
    </main>

    <div id="tooltip" class="tooltip hidden"></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
