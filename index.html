<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Data Viz Portal</title>
    <link rel="icon" type="image/svg+xml" href="src/assets/favicon.svg">
    <link rel="stylesheet" href="src/css/style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loader-overlay" class="loader-overlay">
        <div class="f1-loader">
            <div class="loader-spinner-container">
                <div class="tire-tread"></div>
                <div class="track-orbit"></div>
                <div class="f1-car-dot"></div>
            </div>
            <div class="loader-text">Loading Telemetry</div>
        </div>
    </div>

    <header class="navbar">
        <div class="logo-container">
            <span class="f1-badge">F1</span>
            <span class="logo-text">DATA VIZ PORTAL</span>
            <span class="app-version-badge">v1.16.23</span>
        </div>
        <div class="controls">
            <label>// SELECT SESSION</label>
            <div class="custom-select-container" id="custom-select-container">
                <button class="custom-select-trigger" id="custom-select-trigger">
                    <span id="custom-select-label">SELECT SESSION</span>
                    <span class="custom-select-arrow"></span>
                </button>
                <div class="custom-select-options hidden" id="custom-select-options"></div>
            </div>
            <!-- Hidden native select for accessibility compliance with GEMINI.md -->
            <select id="race-selector" class="visually-hidden"></select>
        </div>
    </header>

    <main class="dashboard">
        <div class="dashboard-header">
            <h1 id="race-title">Loading...</h1>
            <p id="race-stats"></p>
        </div>

        <div class="dashboard-grid">
            <!-- Left Column: Main Telemetry Visualizations -->
            <div class="main-column">
                <section class="viz-container" id="beeswarm-container">
                    <div class="viz-header-controls">
                        <h2>Lap-Time Beeswarm</h2>
                        <div class="viz-controls">
                            <label class="toggle-label">
                                <input type="checkbox" id="outlier-toggle">
                                Show Outliers (e.g. Pit stops, VSC)
                            </label>
                            <div id="beeswarm-legend" class="legend-container"></div>
                        </div>
                    </div>
                    <div id="beeswarm-plot" class="chart"></div>
                </section>

                <section class="viz-container" id="corner-speed-container">
                    <h2>Average Corner Speeds <span class="badge-estimate">Model Estimate</span></h2>
                    <div id="corner-speed-chart" class="chart speed-subplots"></div>
                </section>
                
                <section class="viz-container" id="bump-container">
                    <h2>Position Bump Chart</h2>
                    <div id="bump-chart" class="chart"></div>
                </section>
            </div>

            <!-- Right Column: Session Standings Sidebar -->
            <div class="sidebar-column">
                <section class="viz-container" id="standings-container">
                    <h2>Session Classification</h2>
                    <div id="standings-list" class="standings-list"></div>
                </section>
            </div>
        </div>
    </main>

    <div id="tooltip" class="tooltip hidden"></div>

    <script type="module" src="src/js/app.js"></script>
</body>
</html>
